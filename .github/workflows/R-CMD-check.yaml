name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    env:
      R_BIOC_VERSION: '3.24'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check-args: 'c("--as-cran")'
          - os: windows-latest
            check-args: 'c("--as-cran", "--no-manual")'
          - os: macos-latest
            check-args: 'c("--as-cran", "--no-manual")'

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
        if: runner.os == 'Linux'
      - name: Install HTML Tidy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes tidy
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            bioc::BiocCheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.check-args }}
          error-on: '"warning"'
      - name: BiocCheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          R CMD build .
          Rscript -e 'BiocCheck::BiocCheck(Sys.glob("panpathAudit_*.tar.gz")[[1]], `no-check-bioc-help` = TRUE, `quit-with-status` = TRUE)'
